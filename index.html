<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARIF WEB WIRE</title>

    <style>
        :root {
            /* Customize your theme */
            --bg-color: #070910;
            --text-color: #ffffff;
            --accent-color: #00f7ff;
            --error-color: #ff4058;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            width: min(90%, 420px);
            padding: 35px 25px;
            text-align: center;
            border: 1px solid rgba(0, 247, 255, 0.35);
            border-radius: 20px;
            background: rgba(17, 21, 35, 0.92);
            box-shadow: 0 0 35px rgba(0, 247, 255, 0.12);
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
            animation: rgbText 4s linear infinite;
        }

        .subtitle {
            color: #9ba5bd;
            font-size: 13px;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        .loader {
            width: 75px;
            height: 75px;
            margin: 0 auto 25px;
            border: 5px solid #242b3b;
            border-top: 5px solid var(--accent-color);
            border-right: 5px solid #a855f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.15);
        }

        .loading-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .loading-description {
            color: #9ba5bd;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .progress-track {
            height: 7px;
            width: 100%;
            background: #252b3a;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(
                90deg,
                #00f7ff,
                #a855f7,
                #ff3cac
            );
            box-shadow: 0 0 15px #00f7ff;
            transition: width 0.2s linear;
        }

        .timer {
            color: #c3ccdf;
            font-size: 13px;
        }

        .error-box {
            display: none;
        }

        .error-icon {
            width: 65px;
            height: 65px;
            border: 2px solid var(--error-color);
            color: var(--error-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 22px;
            box-shadow: 0 0 25px rgba(255, 64, 88, 0.18);
        }

        .error-title {
            color: var(--error-color);
            font-size: 19px;
            margin-bottom: 13px;
        }

        .error-message {
            color: #d0d5e2;
            font-size: 14px;
            line-height: 1.7;
        }

        .retry-button {
            margin-top: 25px;
            padding: 12px 28px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            transition: 0.3s;
        }

        .retry-button:hover {
            background: var(--accent-color);
            color: #070910;
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.35);
        }

        .footer {
            margin-top: 32px;
            font-size: 11px;
            color: #69748d;
            letter-spacing: 1px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes rgbText {
            0%   { color: #00f7ff; }
            33%  { color: #a855f7; }
            66%  { color: #ff3cac; }
            100% { color: #00f7ff; }
        }

        @media (max-width: 400px) {
            .logo {
                font-size: 23px;
            }

            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section id="loadingScreen">
            <h1 class="logo">SARIF WEB WIRE</h1>
            <p class="subtitle">SECURE WEB CONNECTION</p>

            <div class="loader"></div>

            <h2 class="loading-title">Please Wait...</h2>
            <p class="loading-description">
                Establishing your connection
            </p>

            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <p class="timer">
                Loading: <span id="timeLeft">120</span> seconds
            </p>
        </section>

        <section class="error-box" id="errorScreen">
            <h1 class="logo">SARIF WEB WIRE</h1>
            <p class="subtitle">CONNECTION STATUS</p>

            <div class="error-icon">!</div>

            <h2 class="error-title">Connection Failed</h2>

            <p class="error-message">
                Check your network<br>
                please try again
            </p>

            <button class="retry-button" onclick="startLoading()">
                TRY AGAIN
            </button>
        </section>

        <footer class="footer">
            © 2026 SARIF WEB WIRE
        </footer>

    </main>

    <script>
        /*
         * CUSTOM SETTINGS
         *
         * Change 120 to your desired loading duration in seconds.
         *
         * Examples:
         * 30  = 30 seconds
         * 60  = 1 minute
         * 120 = 2 minutes
         * 180 = 3 minutes
         * 300 = 5 minutes
         */

        const LOADING_TIME = 120;

        let startTime;
        let animationFrame;
        let loading = false;

        const loadingScreen = document.getElementById("loadingScreen");
        const errorScreen = document.getElementById("errorScreen");
        const progressBar = document.getElementById("progressBar");
        const timeLeft = document.getElementById("timeLeft");

        function startLoading() {
            cancelAnimationFrame(animationFrame);

            loadingScreen.style.display = "block";
            errorScreen.style.display = "none";

            progressBar.style.width = "0%";
            timeLeft.textContent = LOADING_TIME;

            startTime = performance.now();
            loading = true;

            updateLoading();
        }

        function updateLoading() {
            if (!loading) return;

            const elapsed = (performance.now() - startTime) / 1000;
            const remaining = Math.max(0, LOADING_TIME - elapsed);
            const progress = Math.min(
                100,
                (elapsed / LOADING_TIME) * 100
            );

            progressBar.style.width = progress + "%";
            timeLeft.textContent = Math.ceil(remaining);

            if (elapsed >= LOADING_TIME) {
                loading = false;

                loadingScreen.style.display = "none";
                errorScreen.style.display = "block";

                return;
            }

            animationFrame = requestAnimationFrame(updateLoading);
        }

        startLoading();
    </script>

</body>
</html>
